name: Backlog Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # Every monday at 2 am UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install project
        run: uv sync --no-dev

      - name: Run backlog update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run source/maintenance/backlog_updator.py

      - name: Run backlog generator script
        run: uv run source/generation/backlog_generator.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dynamic/backlog_generated.json
          git add ../resources/maintenance/backlog.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Run backlog maintenance"
          git pull --rebase
          git push
