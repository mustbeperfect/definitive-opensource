name: Update Applications Metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Every day at midnight UTC
  push:
    branches:
      - main
    paths:
      - "core/data/static/applications.json"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install project
        run: uv sync --no-dev

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run source/maintenance/stats_updator.py

      - name: Run README generator script
        run: uv run source/generation/readme_generator.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dynamic/applications_generated.json
          git add ../resources/readmes/
          git add ../README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update applications metadata and READMEs"
          git pull --rebase
          git push

